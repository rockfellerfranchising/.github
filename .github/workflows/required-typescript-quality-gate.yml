name: Required TypeScript Quality Gate

on:
    pull_request:
    merge_group:

permissions:
    contents: read
    pull-requests: read

concurrency:
    group: required-quality-gate-${{ github.repository }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    governance:
        if: ${{ github.event_name == 'pull_request' }}
        uses: rockfellerfranchising/.github/.github/workflows/reusable-pr-governance.yml@main
        with:
            require-main-source-branches: develop,staging,hotfix/
            allowed-develop-sources: feature/,fix/,bugfix/,hotfix/,chore/,refactor/,docs/,release/,test/,ci/,build/,perf/,deps/,dependabot/,renovate/,sync/
            allowed-staging-sources: develop,release/,hotfix/,fix/,bugfix/,sync/,dependabot/
            validate-pr-body: true

    quality:
        uses: rockfellerfranchising/.github/.github/workflows/reusable-typescript-quality.yml@main
        with:
            node-version: "22"
            bun-version: "1.3.8"
            require-lint: true
            require-typecheck: true
            require-test: true
            require-build: false
            require-format-check: false
